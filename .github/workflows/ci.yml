name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    # windows-latest: scripts/edrawings/* automates SolidWorks eDrawings via
    # Windows COM (PowerShell) and its tests bake in Windows-style paths
    # (backslashes, drive letters) — they fail on Linux runners where those
    # strings resolve as opaque filenames instead of directory paths.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
